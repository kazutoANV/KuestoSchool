<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>KuestoSchool</title>
<style>
:root{--bg:#fff;--surface:#f7f8fa;--line:#e6e8ec;--text:#111318;--muted:#6b7280;--accent:#2563eb;--accent-soft:#eaf1ff;--ok:#16a34a;--warn:#d97706;color-scheme:light}
[data-theme="dark"]{--bg:#0d0f14;--surface:#161921;--line:#262b36;--text:#eef0f4;--muted:#9aa3b2;--accent:#60a5fa;--accent-soft:#1a2740;--ok:#4ade80;--warn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:6px 10px 22px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14px;margin-bottom:2px}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 12px 6px}
main{padding:28px clamp(16px,4vw,44px);max-width:1100px;width:100%}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;margin-bottom:12px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{filter:brightness(.97)}
.icon-btn{width:40px;height:40px;padding:0;justify-content:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px}
.stat-ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:12px}
.stat-val{font-size:24px;font-weight:700}
.bar{height:8px;background:var(--surface);border-radius:99px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex-shrink:0}
.rank{width:26px;color:var(--muted);font-size:13px;font-weight:600}
.grow{flex:1}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:14px;margin-bottom:8px;cursor:pointer}
.opt.correct{border-color:var(--ok);background:rgba(22,163,74,.1)}
.opt.wrong{border-color:#dc2626;background:rgba(220,38,38,.08)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:7px 14px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
input,select{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);width:100%}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.field{margin-bottom:14px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.lvl{width:72px;height:72px;border-radius:50%;border:4px solid var(--accent);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--accent)}
.mobile-bar{display:none}
.center-card{max-width:380px;margin:60px auto}
.tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:6px;margin-right:6px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(22,163,74,.12)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#view>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.grid>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.grid>*:nth-child(2){animation-delay:.06s}.grid>*:nth-child(3){animation-delay:.12s}.grid>*:nth-child(4){animation-delay:.18s}.grid>*:nth-child(5){animation-delay:.24s}.grid>*:nth-child(6){animation-delay:.3s}
.center-card{animation:up .5s both}
.bar>span{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.lvl,.logo-mark{animation:pop .6s both}
.lvl{animation-delay:.2s}
.pill.ok{animation:pulse 2s infinite}
.opt{transition:transform .2s,border-color .2s,background .2s}
.opt:hover{transform:translateX(4px);border-color:var(--accent)}
.opt.correct,.opt.wrong{animation:shake .4s}
.card,.hero,.btn,.row,.stat-ic,.nav a{transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,color .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.07)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.nav a:hover{transform:translateX(4px)}
.row:hover{background:var(--surface)}
.stat-ic .ic{transition:transform .3s}.stat-ic:hover .ic{transform:rotate(-8deg) scale(1.1)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:50}
#toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;left:-260px;top:0;width:250px;height:100vh;background:var(--bg);z-index:20;transition:left .25s;box-shadow:0 0 0 1px var(--line)}
 aside.open{left:0}
 .mobile-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
}
</style>
</head>
<body>

  <nav class="nav" id="nav"></nav>

<script>
const $ = s => document.querySelector(s);
const ic = (n, size) => `<svg class="ic" ${size?`style="width:${size}px;height:${size}px"`:''}><use href="#i-${n}"/></svg>`;

const PAGES = [
 {group:"Asosiy"},
 {id:"home", t:"Bosh sahifa", i:"home"},
 {id:"dashboard", t:"Kabinet", i:"user"},
 {id:"tests", t:"Testlar", i:"test"},
 {id:"ranking", t:"Reyting", i:"trophy"},
 {id:"achievements", t:"Yutuqlar", i:"medal"},
 {id:"ai", t:"AI yordamchi", i:"bot"},
 {group:"Qo‘shimcha"},
 {id:"library", t:"Kutubxona", i:"book"},
 {id:"schedule", t:"Dars jadvali", i:"cal"},
 {id:"homework", t:"Uy vazifalari", i:"task"},
 {id:"qa", t:"Savol-javob", i:"msg"},
 {id:"dict", t:"Lug‘at", i:"dict"},
 {id:"calc", t:"Kalkulyator", i:"calc"},
 {group:"Rollar"},
 {id:"parent", t:"Ota-ona", i:"family"},
 {id:"teacher", t:"O‘qituvchi", i:"teacher"},
 {id:"admin", t:"Developer panel", i:"shield"},
 {id:"settings", t:"Sozlamalar", i:"gear"},
 {id:"login", t:"Kirish / Ro‘yxat", i:"logout"}
];

function renderNav(active){
 $('#nav').innerHTML = PAGES.filter(p => p.id!=='admin' || (USER && USER.role==='dev')).map(p => p.group
  ? `<small>${p.group}</small>`
  : `<a href="#${p.id}" class="${p.id===active?'active':''}" onclick="closeSide()">${ic(p.i)}${p.t}</a>`).join('');
}

const statCard = (i,label,val) => `<div class="card"><div class="stat-ic">${ic(i)}</div><div class="sub">${label}</div><div class="stat-val">${val}</div></div>`;
const head = (t,s,actions='') => `<header class="top"><div><h1>${t}</h1><p class="sub">${s}</p></div><div>${actions}</div></header>`;

const QUESTIONS = [
 {s:"Matematika", q:"2x + 6 = 14 bo‘lsa, x nechaga teng?", o:["3","4","5","6"], a:1},
 {s:"Fizika", q:"Yorug‘likning vakuumdagi tezligi taxminan qancha?", o:["3·10⁵ km/s","3·10⁸ m/s","3·10³ m/s","3·10⁶ m/s"], a:1},
 {s:"Informatika", q:"Ikkilik sanoq tizimida 1010 qaysi o‘nlik songa teng?", o:["8","10","12","14"], a:1},
];
let qi = 0, score = 0;

const pages = {
 home: () => `
  <div class="hero" style="background:var(--surface)">
   <div class="grow" style="min-width:260px">
    <h1 style="font-size:32px">${CONTENT.heroTitle}</h1>
    <p class="sub" style="font-size:15px;max-width:520px">${CONTENT.heroSub}</p>
    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
     <a class="btn primary" href="#login">${ic('play')} Boshlash</a>
     <a class="btn" href="#ranking">${ic('trophy')} Reyting</a>
    </div>
   </div>
  </div>
  <div class="grid">
   ${[['test','Fanlar bo‘yicha testlar','Matematika, fizika, ingliz tili va boshqalar'],['trophy','Haftalik TOP 10','Sinf va maktab reytingi'],['bolt','XP va level','Har bir to‘g‘ri javob — ball'],['bot','AI yordamchi','Mavzularni sodda tushuntirish']].map(([i,t,d])=>`<div class="card"><div class="stat-ic">${ic(i)}</div><h2>${t}</h2><p class="sub">${d}</p></div>`).join('')}
  </div>`,

 login: () => `
  <div class="center-card card" id="authcard">
   <h1 style="margin-bottom:6px">${CONTENT.loginTitle}</h1>
   <p class="sub" style="margin-bottom:22px">Hisobingizga kiring yoki ro‘yxatdan o‘ting</p>
   <div class="field"><label>Email yoki login</label><input id="l-email" placeholder="ism@maktab.uz"></div>
   <div class="field"><label>Parol</label><input id="l-pass" type="password" placeholder="••••••••"></div>
   <div id="err" style="color:#dc2626;font-size:13px;min-height:18px;margin-bottom:8px"></div><button class="btn primary" onclick="doLogin()" style="width:100%;justify-content:center">Kirish</button>
   <p class="sub" style="text-align:center;margin-top:16px">Yangi o‘quvchimisiz? <a href="#" onclick="showReg(event)" style="color:var(--accent);font-weight:600">Ro‘yxatdan o‘tish</a></p>
  </div>`,

 dashboard: () => `
  ${head('Salom, '+USER.name+'!', (USER.role==='dev'?'Dasturchi':USER.cls+' sinf')+' · Shaxsiy kabinet', `<span class="pill ok">${ic('flame')} 0 kunlik streak</span>`)}
  <div class="hero">
   <div class="lvl">0</div>
   <div class="grow" style="min-width:220px">
    <div style="display:flex;justify-content:space-between;font-size:14px"><strong>Level 0</strong><span class="sub">0 / 100 XP</span></div>
    <div class="bar"><span style="width:0%"></span></div>
    <p class="sub" style="margin-top:8px">Keyingi levelgacha 100 XP kerak</p>
   </div>
  </div>
  <div class="grid" style="margin-bottom:22px">
   ${statCard('chart','O‘zlashtirish','86%')}
   ${statCard('trophy','Sinf reytingi','#3')}
   ${statCard('test','Testlar','0')}
   ${statCard('medal','Medallar','0')}
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
   <div class="card"><h2>Fanlar bo‘yicha</h2>
    ${[['Matematika',0],['Ingliz tili',0],['Fizika',0],['Informatika',0]].map(([n,v])=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${n}</span><span class="sub">${v}%</span></div><div class="bar"><span style="width:${v}%"></span></div></div>`).join('')}
   </div>
   <div class="card"><h2>O‘qish tarixi</h2>
    ${[['test','Matematika — Kvadrat tenglamalar','Bugun · 18/20'],['book','Fizika — Kinematika mavzusi','Kecha'],['check','Informatika — Ikkilik sanoq','2 kun oldin']].map(([i,t,d])=>`<div class="row"><div class="stat-ic" style="margin:0">${ic(i)}</div><div class="grow"><div style="font-size:14px">${t}</div><div class="sub" style="font-size:12px">${d}</div></div></div>`).join('')}
   </div>
  </div>`,

 tests: () => {
  if (qi >= QUESTIONS.length) {
   return `${head('Natija','Test yakunlandi')}<div class="card center-card" style="text-align:center;margin:20px auto">
    <div class="stat-ic" style="margin:0 auto 14px;width:56px;height:56px">${ic('trophy',28)}</div>
    <div class="stat-val">${score} / ${QUESTIONS.length}</div>
    <p class="sub" style="margin:8px 0 20px">+${score*20} XP qo‘shildi</p>
    <button class="btn primary" onclick="restartTest()">${ic('play')} Qayta boshlash</button></div>`;
  }
  const Q = QUESTIONS[qi];
  return `${head('Testlar', `${Q.s} · Savol ${qi+1} / ${QUESTIONS.length}`, `<span class="pill">${ic('clock')} 01:30</span>`)}
  <div class="bar" style="margin-bottom:22px"><span style="width:${(qi/QUESTIONS.length)*100}%"></span></div>
  <div class="card" style="max-width:640px">

   ${[['a-name','Ism',u.name],['a-fam','Familiya',u.fam],['a-user','Username',u.username],['a-email','Email',u.email],['a-cls','Sinf',u.cls],['a-lvl','Level',u.level??0],['a-xp','XP',u.xp??0],['a-pass','Parol',u.pass]].map(([id,l,v])=>`<div class="field"><label>${l}</label><input id="${id}" value="${v}"></div>`).join('')}
   <div style="display:flex;gap:8px"><button class="btn primary" onclick="saveUser()">Saqlash</button><button class="btn" onclick="admTab('users')">Bekor</button></div></div>`;
 }
 return `<div class="card">${USERS.map((u,i)=>`<div class="row"><div class="avatar">${u.name[0]}</div><div class="grow"><div style="font-size:14px">${u.name} ${u.fam}</div><div class="sub" style="font-size:12px">@${u.username} · ${u.cls} · Level ${u.level??0} · ${u.xp??0} XP</div></div><button class="btn" onclick="ADM.eu=${i};route()">${ic('gear')} Tahrir</button>${u.role!=='dev'?`<button class="btn" onclick="delUser(${i})">${ic('x')}</button>`:''}</div>`).join('')}</div>`;
}
function saveUser(){
 const u=USERS[ADM.eu];
 u.name=$('#a-name').value.trim()||u.name; u.fam=$('#a-fam').value.trim()||u.fam;
 u.username=$('#a-user').value.trim().toLowerCase()||u.username; u.email=$('#a-email').value.trim()||u.email;
 u.cls=$('#a-cls').value.trim()||u.cls; u.level=parseInt($('#a-lvl').value)||0; u.xp=parseInt($('#a-xp').value)||0;
 u.pass=$('#a-pass').value||u.pass;
 ADM.eu=-1; route(); toast('Saqlandi');
}
function delUser(i){ USERS.splice(i,1); route(); toast('Akkaunt o‘chirildi'); }
function bankTab(){
 const list=BANK[ADM.sub];
 if(ADM.eq!==-1){
  const c = ADM.eq===-2 ? {q:'', o:['','','',''], a:0} : list[ADM.eq];
  return `<div class="card" style="max-width:640px"><h2>${ADM.eq===-2?'Yangi savol':'Savolni tahrirlash'} · ${ADM.sub}</h2>
   <div class="field"><label>Savol</label><input id="q-text" value="${c.q}"></div>
   ${[0,1,2,3].map(i=>`<div class="field"><label>Variant ${i+1}</label><input id="q-o${i}" value="${c.o[i]??''}"></div>`).join('')}
   <div class="field"><label>To‘g‘ri javob</label><select id="q-a">${[0,1,2,3].map(i=>`<option value="${i}" ${c.a===i?'selected':''}>${i+1}-variant</option>`).join('')}</select></div>
   <div style="display:flex;gap:8px"><button class="btn primary" onclick="saveQ()">Saqlash</button><button class="btn" onclick="ADM.eq=-1;route()">Bekor</button></div></div>`;
 }
 return `<div class="tabs">${SUBJECTS.map(s=>`<button class="${s===ADM.sub?'on':''}" onclick="ADM.sub='${s}';ADM.eq=-1;route()">${s}</button>`).join('')}</div>
  <div class="card">${list.map((c,i)=>`<div class="row"><div class="grow"><div style="font-size:14px">${c.q}</div><div class="sub" style="font-size:12px">To‘g‘ri: ${c.o[c.a]}</div></div><button class="btn" onclick="ADM.eq=${i};route()">${ic('gear')}</button><button class="btn" onclick="delQ(${i})">${ic('x')}</button></div>`).join('')}
  <div style="margin-top:14px"><button class="btn primary" onclick="ADM.eq=-2;route()">${ic('plus')} Savol qo‘shish</button></div></div>`;
}
function saveQ(){
 const arr=BANK[ADM.sub];
 const obj={q:$('#q-text').value.trim(), o:[0,1,2,3].map(i=>$('#q-o'+i).value.trim()), a:parseInt($('#q-a').value)};
 if(!obj.q || obj.o.some(x=>!x)) return toast('Barcha maydonlarni to‘ldiring');
 if(ADM.eq===-2) arr.push(obj); else arr[ADM.eq]=obj;
 ADM.eq=-1; route(); toast('Saqlandi');
}
function delQ(i){ BANK[ADM.sub].splice(i,1); route(); }
function dailyTab(){
 return `<div class="card"><h2>Kunlik test holati</h2><p class="sub" style="margin-bottom:14px">${DAILY.done ? 'Yopiq — keyingi ochilish: '+fmt(DAILY.nextAt-Date.now()) : 'Ochiq'}</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="DAILY.done=false;route()">Ochish</button><button class="btn" onclick="DAILY.done=true;DAILY.nextAt=nextMidnight();route()">Yopish</button></div></div>`;
}
function addAnn(){
 const t=$('#an-t').value.trim(); if(!t) return toast('Sarlavha kiriting');
 ANN.unshift({t, d:$('#an-d').value.trim()}); route(); toast('E’lon joylandi');
}
function annTab(){
 return `<div class="card">${ANN.map((a,i)=>`<div class="row"><div class="grow"><div style="font-size:14px">${a.t}</div><div class="sub" style="font-size:12px">${a.d}</div></div><button class="btn" onclick="ANN.splice(${i},1);route()">${ic('x')}</button></div>`).join('')}
  <div class="field" style="margin-top:14px"><label>Sarlavha</label><input id="an-t"></div><div class="field"><label>Matn</label><input id="an-d"></div>
  <button class="btn primary" onclick="addAnn()">${ic('bell')} E’lon joylash</button></div>`;
}
pages.admin = () => {
 if(!USER || USER.role!=='dev') return head('Ruxsat yo‘q','Bu bo‘lim faqat dasturchi uchun');
 const t=ADM.tab;
 return `${head('Developer panel','Hammasini tahrirlash')}
  <div class="tabs">${[['users','Foydalanuvchilar'],['bank','Savollar'],['daily','Kunlik test'],['ann','E’lonlar']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="admTab('${k}')">${l}</button>`).join('')}</div>
  ${t==='users'?usersTab():t==='bank'?bankTab():t==='daily'?dailyTab():annTab()}`;
};
const CONTENT = {brand:'KuestoSchool', heroTitle:'Bilim bellashuvi — bir joyda', heroSub:'Testlar, reyting, XP va turnirlar. Har kuni yangi vazifa, har hafta yangi chempion.', loginTitle:'Kirish'};
let DONE = {};
let ADM_TABS = [['users','Foydalanuvchilar'],['bank','Savollar'],['daily','Testlar'],['site','Sayt matnlari'],['ann','E’lonlar']];
function dayKey(){ const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000); }
function todaySet(s){ const b=BANK[s]; const n=Math.min(2,b.length); const start=dayKey()%b.length; const out=[]; for(let i=0;i<n;i++) out.push(b[(start+i)%b.length]); return out; }
function startQuiz(subj){ quizTitle=subj; QZ=todaySet(subj); qi=0; score=0; quizEnd=Date.now()+QZ.length*90000; route(); }
function finishQuiz(){ if(quizTitle && QZ.length) DONE[quizTitle]=dayKey(); qi=QZ.length; route(); }
function applyContent(){ const l=document.querySelector('.logo'); if(l && l.lastChild) l.lastChild.textContent=CONTENT.brand; const s=document.querySelector('.mobile-bar strong'); if(s) s.textContent=CONTENT.brand; document.title=CONTENT.brand; }
let lastDay = dayKey();
function tick2(){
 const c=$('#cd2'); if(c) c.textContent=fmt(nextMidnight()-Date.now());
 if(dayKey()!==lastDay){ lastDay=dayKey(); if(!QZ.length) route(); }
 applyContent();
}
setInterval(tick2, 1000);
pages.tests = () => {
 if(QZ.length && qi>=QZ.length){
  return `${head('Natija', quizTitle)}<div class="card center-card" style="text-align:center;margin:20px auto">
   <div class="stat-ic" style="margin:0 auto 14px;width:56px;height:56px">${ic('trophy',28)}</div>
   <div class="stat-val">${score} / ${QZ.length}</div>
   <p class="sub" style="margin:8px 0 20px">+${score*20} XP</p>
   <button class="btn primary" onclick="exitQuiz()">Testlarga qaytish</button></div>`;
 }
 if(QZ.length){
  const c=QZ[qi];
  return `${head(quizTitle, `Savol ${qi+1} / ${QZ.length}`, `<span class="pill" style="font-variant-numeric:tabular-nums">${ic('clock')} <span id="qt">${fmt(quizEnd-Date.now())}</span></span>`)}
  <div class="bar" style="margin-bottom:22px"><span style="width:${(qi/QZ.length)*100}%"></span></div>
  <div class="card" style="max-width:640px"><h2 style="font-size:19px;margin-bottom:18px">${c.q}</h2>${c.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="answer(${i})">${o}</button>`).join('')}<div id="next" style="margin-top:10px"></div></div>`;
 }
 const k=dayKey();
 return `${head('Testlar','Har bir fan bo‘yicha kunlik test', `<span class="pill" style="font-variant-numeric:tabular-nums">${ic('clock')} <span id="cd2">${fmt(nextMidnight()-Date.now())}</span></span>`)}
  <p class="sub" style="margin-bottom:16px">Keyingi kun testlar almashadi. Qolgan vaqt yuqorida ko‘rsatilgan.</p>
  <div class="grid">${SUBJECTS.map(s=>{ const done=DONE[s]===k; return `<div class="card" style="${done?'':'cursor:pointer'}" ${done?'':`onclick="startQuiz('${s}')"`}><div class="stat-ic">${ic('test')}</div><h2 style="margin-bottom:4px">${s}</h2><p class="sub">${done?'Bugun topshirildi':todaySet(s).length+' ta savol · bugungi test'}</p>${done?'<span class="pill ok">Bajarildi</span>':'<span class="tag">Boshlash</span>'}</div>`; }).join('')}</div>`;
};
pages.ranking = () => {
 const list=USERS.slice().sort((a,b)=>(b.xp??0)-(a.xp??0));
 return `${head('Reyting','Barcha o‘quvchilar XP bo‘yicha')}` + (list.length ? `<div class="card">${list.map((u,i)=>`<div class="row"><span class="rank">${i+1}</span><div class="avatar">${u.name[0]}</div><div class="grow">${u.name} ${u.fam}<div class="sub" style="font-size:12px">${u.cls}</div></div><span class="pill">${ic('bolt',14)} ${u.xp??0} XP</span></div>`).join('')}</div>` : `<div class="card"><p class="sub">Hozircha reyting bo‘sh.</p></div>`);
};
function testsTab(){
 const k=dayKey();
 return `<div class="card"><h2>Kunlik testlar</h2><p class="sub" style="margin:6px 0 14px">Har bir fan uchun bugungi test. Kun o‘tgach savollar almashadi.</p>${SUBJECTS.map(s=>`<div class="row"><div class="grow">${s}<div class="sub" style="font-size:12px">${DONE[s]===k?'Bugun topshirilgan':'Ochiq'}</div></div><button class="btn" onclick="DONE['${s}']=0;route()">Qayta ochish</button></div>`).join('')}<div style="margin-top:14px"><button class="btn primary" onclick="DONE={};route();toast('Barcha testlar ochildi')">Hammasini qayta ochish</button></div></div>`;
}
function siteTab(){
 return `<div class="card" style="max-width:640px"><h2>Asosiy matnlar</h2>
  ${[['s-brand','Sayt nomi',CONTENT.brand],['s-hero','Bosh sahifa sarlavhasi',CONTENT.heroTitle],['s-sub','Bosh sahifa matni',CONTENT.heroSub],['s-login','Kirish sarlavhasi',CONTENT.loginTitle]].map(([id,l,v])=>`<div class="field"><label>${l}</label><input id="${id}" value="${v}"></div>`).join('')}
  <h2 style="margin-top:20px">Menyu nomlari</h2>
  ${PAGES.map((p,i)=>p.id?`<div class="field"><label>${p.id}</label><input id="s-p${i}" value="${p.t}"></div>`:'').join('')}
  <button class="btn primary" onclick="saveSite()">Saqlash</button></div>`;
}
function saveSite(){
 CONTENT.brand=$('#s-brand').value.trim()||CONTENT.brand;
 CONTENT.heroTitle=$('#s-hero').value.trim()||CONTENT.heroTitle;
 CONTENT.heroSub=$('#s-sub').value.trim();
 CONTENT.loginTitle=$('#s-login').value.trim()||CONTENT.loginTitle;
 PAGES.forEach((p,i)=>{ if(p.id){ const e=$('#s-p'+i); if(e && e.value.trim()) p.t=e.value.trim(); } });
 route(); toast('Saqlandi');
}
pages.admin = () => {
 if(!USER || USER.role!=='dev') return head('Ruxsat yo‘q','Bu bo‘lim faqat dasturchi uchun');
 const t=ADM.tab;
 return `${head('Developer panel','Hammasini tahrirlash')}
  <div class="tabs">${ADM_TABS.map(([k,l])=>`<button class="${t===k?'on':''}" onclick="admTab('${k}')">${l}</button>`).join('')}</div>
  ${t==='users'?usersTab():t==='bank'?bankTab():t==='daily'?testsTab():t==='site'?siteTab():annTab()}`;
};
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
